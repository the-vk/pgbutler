[package]
name = "pgbutler"
version = "0.1.0"
authors = ["Andrew Maraev <the_vk@thevk.net"]
description = """
pgbutler is an AI tool to analyze your PostgreSQL instance and provide helpful
recommendations.
"""
documentation = "https://github.com/the-vk/pgbutler"
homepage = "https://github.com/the-vk/pgbutler"
repository = "https://github.com/the-vk/pgbutler"
keywords = ["postgres", "postgresql", "ollama"]
license = "GPL-3.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
chrono = "0.4.45"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
keyring-core = "1.0.0"
log = { version = "0.4.34", features = ["kv"] }
logforth = { version = "0.30.1", features = ["starter-log"] }
openssl = "0.10.81"
postgres-openssl = "0.5.3"
ratatui = "0.30.2"
rig = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = "0.7.18"
toml = "1.1.5"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
